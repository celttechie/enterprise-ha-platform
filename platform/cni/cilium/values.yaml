---
# ==============================================================================
# Cilium eBPF CNI Configuration for Talos Linux HA Cluster
# Architecture: Native eBPF Routing, Kube-Proxy Replacement, Hubble Observability
# ==============================================================================

ipam:
  mode: kubernetes

kubeProxyReplacement: true

# Point Cilium directly at Talos KubePrism (127.0.0.1:7445) for node-local
# Active/Active/Active load balancing across all 3 control plane nodes (ADR-0007).
k8sServiceHost: 127.0.0.1
k8sServicePort: 7445

# Talos Linux kernel hardening compatibility:
# Talos does not grant SYS_MODULE capability to containers and manages
# cgroups v2 at /sys/fs/cgroup.
securityContext:
  capabilities:
    ciliumAgent:
      - CHOWN
      - KILL
      - NET_ADMIN
      - NET_RAW
      - IPC_LOCK
      - SYS_ADMIN
      - SYS_RESOURCE
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    cleanCiliumState:
      - NET_ADMIN
      - SYS_ADMIN
      - SYS_RESOURCE

cgroup:
  autoMount:
    enabled: false
  hostRoot: /sys/fs/cgroup

operator:
  replicas: 2
  rollOutPods: true

rollOutCiliumPods: true

hubble:
  enabled: true
  relay:
    enabled: true
  ui:
    enabled: false
