---
# ==============================================================================
# Cilium eBPF CNI Configuration for Talos Linux HA Cluster
# Architecture: Native eBPF Routing, Kube-Proxy Replacement, Hubble Observability
# ==============================================================================

ipam:
  mode: kubernetes

kubeProxyReplacement: true

# Point Cilium directly at the Talos Layer-2 Virtual IP (VIP) because
# kube-proxy is disabled on all nodes.
k8sServiceHost: 192.168.122.200
k8sServicePort: 6443

# Talos Linux kernel hardening compatibility:
# Talos does not grant SYS_MODULE capability to containers and manages
# cgroups v2 at /sys/fs/cgroup.
securityContext:
  capabilities:
    ciliumAgent:
      - CHOWN
      - KILL
      - NET_ADMIN
      - NET_RAW
      - IPC_LOCK
      - SYS_ADMIN
      - SYS_RESOURCE
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    cleanCiliumState:
      - NET_ADMIN
      - SYS_ADMIN
      - SYS_RESOURCE

cgroup:
  autoMount:
    enabled: false
  hostRoot: /sys/fs/cgroup

operator:
  replicas: 2
  rollOutPods: true

rollOutCiliumPods: true

hubble:
  enabled: true
  relay:
    enabled: true
  ui:
    enabled: false
